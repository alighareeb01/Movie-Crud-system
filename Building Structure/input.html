<div class="container form-color">
  <div class="row g-1">
    <div class="header">
      <h1 class="text-primary text-center">Movie Crud System</h1>
    </div>
    <div class="movieName col-12 col-md-3">
      <label for="movieName"></label>
      <input
        type="text"
        id="movieName"
        placeholder="Movie Name"
        class="border border-0 form-control"
      />
    </div>
    <div class="DirectorName col-12 col-md-3">
      <label for="DirectorName"></label>
      <input
        type="text"
        id="DirectorName"
        placeholder="Director Name"
        class="border border-0 form-control"
      />
    </div>
    <div class="Category col-12 col-md-3">
      <label for="Category"></label>
      <input
        type="text"
        id="Category"
        placeholder="Category"
        class="border border-0 form-control"
      />
    </div>
    <div class="Year col-12 col-md-3">
      <label for="Year"></label>
      <input
        type="text"
        id="Year"
        placeholder="Year"
        class="border border-0 form-control"
      />
    </div>
    <div class="imageUpload">
      <div class="mb-3">
        <label for="formFile" class="form-label"
          >Default file input example</label
        >
        <input class="form-control" type="file" id="formFile" />
      </div>
    </div>
    <div class="addMovieButton mt-5 col-12 d-flex justify-content-center">
      <button
        type="button"
        class="btn btn-primary btn-lg form-control w-50 p-2"
      >
        Add Movie
      </button>
    </div>
  </div>
</div>
